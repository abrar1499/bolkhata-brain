name: Phone model (Gemma 3n E2B GGUF)

on:
  push:
    branches: [phone-model]
    paths: [.github/workflows/gemma3n.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download ready GGUF (ungated mirror)
        run: |
          pip install huggingface_hub
          python - <<'PY'
          from huggingface_hub import HfApi, hf_hub_download
          import shutil
          repo = "unsloth/gemma-3n-E2B-it-GGUF"
          info = HfApi().model_info(repo, files_metadata=True)
          sizes = {f.rfilename: f.size for f in info.siblings if f.rfilename.endswith(".gguf") and "/" not in f.rfilename}
          for k, v in sorted(sizes.items(), key=lambda x: x[1]): print(f"{v/1e9:.2f} GB  {k}")
          order = ["Q4_0", "IQ4_NL", "IQ4_XS", "Q4_K_S", "Q3_K_M"]
          pick = next((f for p in order for f, sz in sizes.items() if p in f and sz < 2.0e9), None)
          print("PICK", pick, sizes.get(pick))
          shutil.copy(hf_hub_download(repo, pick), "gupshup-gemma3n-e2b.gguf")
          PY
          ls -lh *.gguf
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete gemma3n-v1 -R "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create gemma3n-v1 gupshup-gemma3n-e2b.gguf -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Phone model: Gemma 3n E2B (Q4)" --notes "Google Gemma 3n E2B instruct, GGUF from unsloth. Use under the Gemma Terms of Use."
