name: Gup Shup APK v4 (LiteRT + tools)
on:
  push:
    branches: [phone-model]
    paths: [android-litert/**, .github/workflows/gupshup-lite-apk.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Build
        working-directory: android-litert
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-litert/app/build/outputs/apk/debug/app-debug.apk GupShup-v4.apk && ls -lh GupShup-v4.apk
          gh release delete gupshup-app-v4 -R "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create gupshup-app-v4 GupShup-v4.apk -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Gup Shup APK v5 (Gemma 4, new design)" --notes "Gemma 4 E2B/E4B on LiteRT-LM, code cards, Python runner, GitHub, HTML to APK."
