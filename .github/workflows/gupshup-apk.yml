name: Gup Shup APK

on:
  push:
    branches: [phone-model]
    paths: [android/**, .github/workflows/gupshup-apk.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare app (llama.cpp Android sample + Gup Shup changes)
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp
          A=llama.cpp/examples/llama.android
          cp android/MainActivity.kt   $A/app/src/main/java/com/example/llama/MainActivity.kt
          cp android/AndroidManifest.xml $A/app/src/main/AndroidManifest.xml
          sed -i 's/AI Chat basic sample/Gup Shup/' $A/app/src/main/res/values/strings.xml
          sed -i 's/applicationId = "com.example.llama.aichat"/applicationId = "com.abrar.gupshup"/' $A/app/build.gradle.kts
          sed -i 's/minSdk = 33/minSdk = 29/' $A/app/build.gradle.kts $A/lib/build.gradle.kts
          sed -i 's/abiFilters += listOf("arm64-v8a", "x86_64")/abiFilters += listOf("arm64-v8a")/' $A/lib/build.gradle.kts
          sed -i 's/DEFAULT_CONTEXT_SIZE    = 8192/DEFAULT_CONTEXT_SIZE    = 2048/; s/DEFAULT_SAMPLER_TEMP    = 0.3f/DEFAULT_SAMPLER_TEMP    = 0.5f/' $A/lib/src/main/cpp/ai_chat.cpp
          perl -0pi -e 's/(<ScrollView\s+android:layout_width="match_parent"\s+)android:layout_height="0dp"\s+android:layout_weight="1"/$1android:layout_height="wrap_content"/' $A/app/src/main/res/layout/activity_main.xml
          perl -0pi -e 's/android:text="Selected GGUF model.s metadata will show here."/android:text="Gup Shup"/' $A/app/src/main/res/layout/activity_main.xml
          grep -n "applicationId\|minSdk\|abiFilters" $A/app/build.gradle.kts $A/lib/build.gradle.kts
          grep -n "DEFAULT_CONTEXT_SIZE    =\|DEFAULT_SAMPLER_TEMP    =" $A/lib/src/main/cpp/ai_chat.cpp

      - name: Android NDK + CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.13113456" "cmake;3.31.6" > /dev/null

      - name: Build APK
        working-directory: llama.cpp/examples/llama.android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp llama.cpp/examples/llama.android/app/build/outputs/apk/debug/app-debug.apk GupShup.apk
          ls -lh GupShup.apk
          gh release delete gupshup-app-v1 -R "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create gupshup-app-v1 GupShup.apk -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Gup Shup APK (offline AI)" \
            --notes "Android 10+ (64-bit). First launch: choose Tez (447 MB) or Behtar (1.2 GB) model to download once; after that it works offline."
