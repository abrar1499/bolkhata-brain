name: Phone model (Gemma 3 1B LiteRT)
on:
  push:
    branches: [phone-model]
    paths: [.github/workflows/gemma3-1b-litert.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download Gemma 3 1B .litertlm
        run: |
          pip install -q huggingface_hub
          python - <<'PY'
          from huggingface_hub import HfApi, hf_hub_download
          import shutil, sys
          api = HfApi(); cands = []
          repos = {"litert-community/Gemma3-1B-IT"}
          for q in ["gemma3-1b", "gemma-3-1b", "Gemma3-1B"]:
              try:
                  for m in api.list_models(search=q, limit=100):
                      if "litert" in m.id.lower() or "tflite" in m.id.lower() or "mediapipe" in m.id.lower(): repos.add(m.id)
              except Exception as e: print("search fail", q, e)
          for repo in sorted(repos):
              try: info = api.model_info(repo, files_metadata=True)
              except Exception as e: print("NO", repo, type(e).__name__); continue
              for f in info.siblings:
                  n = f.rfilename.lower()
                  if n.endswith(".litertlm") and f.size and 400e6 < f.size < 800e6 and "mt69" not in n and "sm8" not in n and "tensor" not in n:
                      print(f"{repo}  {f.size/1e6:.0f} MB  {f.rfilename}"); cands.append((repo, f.rfilename, f.size))
          cands.sort(key=lambda c: (0 if c[0] == "litert-community/Gemma3-1B-IT" and c[1] == "gemma3-1b-it-int4.litertlm" else 1, 0 if "multi-prefill" in c[1] else 1))
          for repo, fn, size in cands:
              try:
                  shutil.copy(hf_hub_download(repo, fn), "gupshup-gemma3-1b.litertlm"); print("GOT", repo, fn, size); break
              except Exception as e: print("DL FAIL", repo, fn, str(e)[:120])
          else: sys.exit(1)
          PY
          ls -l gupshup-gemma3-1b.litertlm
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete gemma3-1b-litert-v1 -R "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create gemma3-1b-litert-v1 gupshup-gemma3-1b.litertlm -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Gemma 3 1B (LiteRT)" --notes "Small Gemma model for Gup Shup."
